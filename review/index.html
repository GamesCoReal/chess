
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="../">
<title>Chess Review</title>
<link rel="icon" type="image/png" href="./images/icons/favicon.png">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #202124;
  color: #fff;
  overscroll-behavior-y: none;
  -webkit-text-size-adjust: 100%;
}

body {
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

.container {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 12px 14px calc(24px + env(safe-area-inset-bottom));
}

/* Player rows */

.player {
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(8ch, 1fr);
  align-items: center;
  width: min(100%, 700px);
  margin: 8px auto;
  font-size: clamp(15px, 4.2vw, 19px);
}

.player-name {
  grid-column: 1;
  display: flex;
  align-items: center;
  min-width: 0;
  white-space: nowrap;
}

.player-name input {
  width: 100%;
  min-width: 0;
  padding: 5px 7px;
  border: 1px solid #45464a;
  border-radius: 6px;
  outline: none;
  background: #2d2f33;
  color: #fff;
  font-size: inherit;
  font-weight: 600;
}

.player-name input:focus {
  border-color: #c9a84c;
}

.player-opening-name {
  justify-self: center;
  max-width: 100%;
  overflow: hidden;
  color: #c9a84c;
  font-size: .7em;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#your-clock,
#maia-clock {
  grid-column: 3;
  min-width: 8ch;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Board */

#board-wrap {
  display: flex;
  flex-direction: column;
  position: relative;
}

#maia-player {
  order: 1;
}

#board-with-eval {
  order: 2;
}

#your-player {
  order: 3;
}

#board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: min(100%, 700px);
  aspect-ratio: 1 / 1;
  margin: auto;
  border: 3px solid #555;
  border-radius: 4px;
  overflow: hidden;
  touch-action: none;
}

#board-with-eval {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) 10px;
  gap: 6px;
  align-items: stretch;
  width: 100%;
}

#capture-rail {
  display: grid;
  grid-template-rows: 1fr 1fr;
  min-height: 0;
}

.capture-rail-side {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 2px;
  min-height: 0;
  padding: 3px 0;
}

.capture-rail-side.bottom {
  justify-content: flex-end;
}

.capture-rail-side img {
  width: 18px;
  height: 18px;
  object-fit: contain;
}

.captured-piece-count {
  position: relative;
  width: 27px;
  height: 27px;
  flex: 0 0 27px;
}

.captured-piece-count img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.captured-piece-count .count-badge {
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 13px;
  height: 13px;
  padding: 0 2px;
  border-radius: 7px;
  font-size: 9px;
  line-height: 1;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.captured-piece-count.piece-white span {
  background: #eee;
  color: #111;
}

.captured-piece-count.piece-black span {
  background: #222;
  color: #fff;
}

.replay-eval-meter {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-height: 0;
}

.replay-eval-score {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 3;
  transform: translate(-50%, -50%);
  min-width: 48px;
  width: max-content;
  padding: 1px 3px;
  border-radius: 3px;
  background: rgba(25, 26, 28, .82);
  box-shadow: 0 1px 4px rgba(0, 0, 0, .55);
  font-size: 10px;
  line-height: 14px;
  color: #fff;
  text-align: center;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}

.replay-eval-bar {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-self: stretch;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #555;
  border-radius: 4px;
  background: #25262a;
}

.replay-eval-bar.hidden {
  display: none;
}

.eval-bar-black {
  flex: 0 0 50%;
  width: 100%;
  background: #25262a;
}

.eval-bar-white {
  flex: 0 0 50%;
  width: 100%;
  background: #eee;
}

/* Board squares */

.square {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

.square.drag-hover {
  outline: 3px solid #c9a84c;
  outline-offset: -3px;
  background-color: rgba(201, 168, 76, .25);
}

.square.light {
  background: #f0d9b5;
}

.square.dark {
  background: #b58863;
}

.square.selected {
  outline: 3px solid #c9a84c;
  outline-offset: -3px;
}

.square.premove-square {
  background: #df4545 !important;
  outline: 2px solid #ff7777;
  outline-offset: -2px;
}

.square.last-move {
  background-color: rgba(201, 168, 76, .45);
}

.square.reverse-fen-highlight {
  background-color: rgba(46, 204, 113, .68) !important;
  outline: 2px solid rgba(39, 174, 96, .95);
  outline-offset: -2px;
}

.square.legal-target::after {
  content: "";
  position: absolute;
  width: 32%;
  height: 32%;
  border-radius: 50%;
  background: rgba(255, 255, 255, .85);
  pointer-events: none;
}

.square.legal-target.has-piece::after {
  width: 88%;
  height: 88%;
  background: transparent;
  border: 5px solid rgba(255, 255, 255, .75);
  box-sizing: border-box;
}

.square-coordinate {
  position: absolute;
  pointer-events: none;
  user-select: none;
  font-size: 11px;
  line-height: 1;
  font-weight: 700;
  opacity: .75;
  z-index: 1;
}

.square-coordinate.file-label {
  right: 4px;
  bottom: 3px;
}

.square-coordinate.rank-label {
  left: 4px;
  top: 50%;
  transform: translateY(-50%);
}

.square.dark .square-coordinate {
  color: rgba(255, 255, 255, .72);
}

.square.light .square-coordinate {
  color: rgba(0, 0, 0, .56);
}

.piece {
  width: 80%;
  height: 80%;
  pointer-events: none;
  user-select: none;
  position: relative;
  z-index: 2;
}

.board-annotations {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 5;
  pointer-events: none;
  overflow: visible;
}

.board-annotations path,
.board-annotations circle {
  stroke: #e53935;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.board-annotations path {
  fill: none;
}

.board-annotations marker path {
  fill: #e53935;
  stroke: none;
}

.board-annotations .annotation-preview {
  opacity: .65;
}

.hint-highlight {
  background: rgba(255, 215, 0, .55) !important;
}

.piece-rating-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  width: clamp(13px, 40%, 22px);
  height: auto;
  z-index: 6;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7));
}

/* Status */

#offline-status {
  min-height: 14px;
  text-align: center;
  font-size: 10px;
  line-height: 14px;
  color: #bfc0c3;
}

#status {
  text-align: center;
  margin: 2px 0 10px;
  font-size: 14px;
  color: #bbb;
  min-height: 18px;
  transition: opacity .6s ease;
  opacity: 1;
}

#status.status-hidden {
  opacity: 0;
}

#placement-status {
  margin: 0 auto 8px;
  padding: 7px 10px;
  border: 1px solid #6b5b2b;
  border-radius: 8px;
  background: #302b1d;
  color: #f0d494;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

/* Search */

#game-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  width: 100%;
  margin: 18px auto;
}

#review-search-button {
  flex: 1 1 100%;
  min-height: 46px;
  border: none;
  border-radius: 24px;
  background: #238636;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}

#review-search-button:active {
  background: #2ea043;
}

#review-search-button:disabled {
  opacity: .6;
  cursor: wait;
}

#review-search-status {
  min-height: 18px;
  margin: -10px 0 12px;
  color: #aaa;
  text-align: center;
  font-size: 12px;
}

/* Moves */

.moves {
  width: 100%;
  margin: 14px auto;
  border-top: 1px solid #444;
  border-bottom: 1px solid #444;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.moves::-webkit-scrollbar {
  display: none;
}

.inner {
  width: max-content;
  padding: 8px 0;
  white-space: nowrap;
  font-size: clamp(14px, 4vw, 18px);
}

.movenum {
  color: #888;
  margin-right: 2px;
}

.move {
  margin-right: 14px;
}

.move.replay-current-move {
  display: inline-block;
  margin-right: 9px;
  padding: 2px 6px;
  border-radius: 999px;
  background: #fff;
  color: #111;
  font-weight: 700;
}

/* Replay controls */

.replay-controls {
  width: min(100%, 700px);
  gap: 6px;
  margin: 10px auto;
  flex-wrap: nowrap;
}

.replay-controls button {
  flex: 0 0 auto;
  min-width: 42px;
  min-height: 40px;
  padding: 8px 12px;
  font-size: 14px;
}

.replay-controls #replay-exit,
.replay-controls #flip-button {
  flex: 1 1 0;
  min-width: 0;
  min-height: 40px;
  padding: 8px 6px;
}

.replay-controls #replay-position {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 30px;
  color: #bfc0c3;
  font-size: 12px;
  line-height: 13px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.replay-position-current {
  font-weight: 700;
}

.replay-position-total {
  font-size: 10px;
  font-weight: 700;
  color: #888;
}

/* History */

#history-title {
  margin: 12px 0 4px;
  color: #aaa;
  font-size: 12px;
  text-align: center;
}

#history-title[hidden] {
  display: none;
}

.history {
  width: 100%;
  margin: 10px auto 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.history-empty {
  grid-column: 1 / -1;
  padding: 16px 6px;
  color: #888;
  font-size: 13px;
  text-align: center;
}

.history-card {
  background: #2d2d2d;
  border: 1px solid #4a4a4a;
  border-radius: 10px;
  padding: 6px 4px 5px;
  color: #fff;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: center;
  -webkit-user-select: none;
  user-select: none;
}

.history-card:active {
  background: #353638;
}

.hc-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0 2px;
}

.hc-result {
  font-size: clamp(10px, 2.6vw, 12px);
  font-weight: 700;
}

.hc-mode {
  font-size: clamp(6.5px, 1.7vw, 8px);
  color: #999;
  text-transform: uppercase;
  letter-spacing: .3px;
}

.hc-top {
  display: flex;
  position: relative;
}

.hc-player {
  flex: 1;
  min-width: 0;
}

.hc-player h4 {
  font-size: clamp(8.5px, 2.2vw, 10px);
  font-weight: 700;
  margin-bottom: 2px;
  color: #ddd;
  overflow-wrap: anywhere;
}

.hc-stat {
  font-size: clamp(7px, 1.9vw, 9px);
  line-height: 1.35;
  color: #ccc;
}

.hc-divider {
  position: absolute;
  left: 50%;
  top: 2px;
  bottom: 2px;
  width: 1px;
  transform: translateX(-50%);
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.05),
    rgba(255,255,255,.35) 15%,
    rgba(255,255,255,.35) 85%,
    rgba(255,255,255,.05)
  );
}

.hc-moves {
  font-family: Consolas, "Courier New", monospace;
  font-size: clamp(6.5px, 1.8vw, 8.5px);
  color: #aaa;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-top: 1px solid #444;
  padding-top: 4px;
  margin-top: 1px;
}

.hidden {
  display: none !important;
}

@media (max-width: 360px) {
  .history {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Game-over overlay */

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 16px;
  border-radius: 4px;
}

.overlay.hidden {
  display: none;
}

.overlay-card {
  background: #2b2c30;
  border: 1px solid #444;
  border-radius: 16px;
  padding: 20px 18px;
  width: 100%;
  max-width: 340px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
  max-height: 80vh;
  overflow-y: auto;
}

.overlay-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 2px;
}

.overlay-sub {
  font-size: 13px;
  color: #999;
  margin-bottom: 16px;
}

.overlay-stats-columns {
  display: flex;
  gap: 14px;
  text-align: left;
  margin-bottom: 18px;
}

.stats-col {
  flex: 1;
  min-width: 0;
}

.stats-col-title {
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
  gap: 6px;
}

.stats-col-title .acc {
  color: #c9a84c;
  font-weight: 700;
}

.stat-line {
  display: flex;
  justify-content: space-between;
  padding: 2px 0;
  color: #ccc;
  font-size: 12px;
  gap: 6px;
}

.stat-line .num {
  font-weight: 600;
  color: #fff;
}

.overlay-buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
}

.overlay-buttons button {
  width: 100%;
  min-height: 44px;
  border: none;
  border-radius: 22px;
  background: #c9a84c;
  color: #202124;
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

  <div id="offline-status" aria-live="polite"></div>

  <div id="status">Chess.com Review</div>
  <div id="placement-status" class="hidden" aria-live="polite"></div>

  <div id="board-wrap">

    <div class="player" id="maia-player">
      <span class="player-name">
        <input
          id="review-top-name"
          type="text"
          placeholder="White username"
          autocomplete="off"
          spellcheck="false"
          aria-label="First Chess.com username"
        >
      </span>
      <span id="maia-opening-name" class="player-opening-name" hidden></span>
      <span id="maia-clock">—</span>
      <span id="maia-rating" hidden>—</span>
    </div>

    <div id="board-with-eval">

      <div id="capture-rail" aria-label="Captured pieces">
        <div id="capture-top" class="capture-rail-side"></div>
        <div id="capture-bottom" class="capture-rail-side bottom"></div>
      </div>

      <div id="board"></div>

      <div id="replay-eval-meter" class="replay-eval-meter hidden">
        <span id="replay-eval-score" class="replay-eval-score">+0.0</span>
        <div
          id="replay-eval-bar"
          class="replay-eval-bar"
          role="button"
          tabindex="0"
          aria-label="Position evaluation"
        >
          <span class="eval-bar-black"></span>
          <span class="eval-bar-white"></span>
        </div>
      </div>

    </div>

    <div class="player" id="your-player">
      <span class="player-name">
        <input
          id="review-bottom-name"
          type="text"
          placeholder="Second Chess.com username"
          autocomplete="off"
          spellcheck="false"
          aria-label="Second Chess.com username"
        >
      </span>
      <span id="your-opening-name" class="player-opening-name" hidden></span>
      <span id="your-clock">—</span>
      <span id="your-name-label" hidden>Review</span>
      <span id="your-rating" hidden>—</span>
    </div>

    <div class="overlay hidden" id="game-over-overlay">
      <div class="overlay-card">
        <div class="overlay-title" id="overlay-title">Game Over</div>
        <div class="overlay-sub" id="overlay-sub"></div>

        <div class="overlay-stats-columns">
          <div class="stats-col">
            <div class="stats-col-title">
              <span>You</span>
              <span class="acc" id="your-accuracy"></span>
            </div>
            <div id="your-stats"></div>
          </div>

          <div class="stats-col">
            <div class="stats-col-title">
              <span>Maia</span>
              <span class="acc" id="maia-accuracy"></span>
            </div>
            <div id="maia-stats"></div>
          </div>
        </div>

        <div class="overlay-buttons">
          <button id="game-over-review-button" onclick="reviewJustFinishedGame()">
            Review Game
          </button>
          <button id="game-over-new-game-button" onclick="newGameCurrentMode()">
            New Game
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="controls" id="game-controls">
    <button id="review-search-button" type="button">
      Search
    </button>
  </div>

  <div id="review-search-status" aria-live="polite"></div>

  <div class="controls hidden" id="puzzle-controls">
    <button id="puzzle-action-btn" onclick="handlePuzzleAction()">Give Up</button>
    <button onclick="useHint()">Hint</button>
  </div>

  <div class="controls hidden" id="drill-controls">
    <button onclick="toggleFlip()" title="Flip the board and switch which side you play">Flip / Side</button>
    <button onclick="exitDrillMode()">Close Variant</button>
    <button id="drill-restart-btn" onclick="restartCurrentDrill()">Restart</button>
    <button id="drill-undo-btn" onclick="undoDrillMove()">Undo</button>
    <button id="drill-return-line-btn" class="hidden" onclick="returnToOpeningLine()">Back to Line</button>
  </div>

  <div class="moves">
    <div class="inner" id="move-list"></div>
  </div>

  <div id="history-title" hidden></div>
  <div class="history" id="history"></div>

</div>

<script src="./chess.min.js" defer></script>
<script src="./engines/maia3/maia-tensor.js" defer></script>
<script src="./engines/maia3/maia-engine.js" defer></script>
<script src="./puzzle/reverse-fen-solver.js" defer></script>
<script src="./engines/stockfish19/stockfish-evaluator.js?v=12" defer></script>
<script src="./engines/sql/sql-wasm.js" defer></script>
<script src="./data/puzzles-db.js?v=4" defer></script>
<script src="./app.js?v=94" defer></script>
<script src="review.js" defer></script>

</body>
</html>
