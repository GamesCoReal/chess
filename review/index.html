
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<base href="../">
<title>Chess Review</title>
<link rel="icon" type="image/png" href="./images/icons/favicon.png">

<link rel="stylesheet" href="./review/review.css">
</head>

<body>
<div class="container">

  <div id="offline-status" aria-live="polite"></div>

  <div id="status">Chess.com Review</div>
  <div id="placement-status" class="hidden" aria-live="polite"></div>

  <div id="board-wrap">

    <div class="player" id="maia-player">
      <span class="player-name">
        <input
          id="review-top-name"
          type="text"
          placeholder="White username"
          autocomplete="off"
          spellcheck="false"
          aria-label="First Chess.com username"
        >
      </span>
      <span id="maia-opening-name" class="player-opening-name" hidden></span>
      <span id="maia-clock">—</span>
      <span id="maia-rating" hidden>—</span>
    </div>

    <div id="board-with-eval">

      <div id="capture-rail" aria-label="Captured pieces">
        <div id="capture-top" class="capture-rail-side"></div>
        <div id="capture-bottom" class="capture-rail-side bottom"></div>
      </div>

      <div id="board"></div>

      <div id="replay-eval-meter" class="replay-eval-meter hidden">
        <span id="replay-eval-score" class="replay-eval-score">+0.0</span>
        <div
          id="replay-eval-bar"
          class="replay-eval-bar"
          role="button"
          tabindex="0"
          aria-label="Position evaluation"
        >
          <span class="eval-bar-black"></span>
          <span class="eval-bar-white"></span>
        </div>
      </div>

    </div>

    <div class="player" id="your-player">
      <span class="player-name">
        <input
          id="review-bottom-name"
          type="text"
          placeholder="Second Chess.com username"
          autocomplete="off"
          spellcheck="false"
          aria-label="Second Chess.com username"
        >
      </span>
      <span id="your-opening-name" class="player-opening-name" hidden></span>
      <span id="your-clock">—</span>
      <span id="your-name-label" hidden>Review</span>
      <span id="your-rating" hidden>—</span>
    </div>

    <div class="overlay hidden" id="game-over-overlay">
      <div class="overlay-card">
        <div class="overlay-title" id="overlay-title">Game Over</div>
        <div class="overlay-sub" id="overlay-sub"></div>

        <div class="overlay-stats-columns">
          <div class="stats-col">
            <div class="stats-col-title">
              <span>You</span>
              <span class="acc" id="your-accuracy"></span>
            </div>
            <div id="your-stats"></div>
          </div>

          <div class="stats-col">
            <div class="stats-col-title">
              <span>Maia</span>
              <span class="acc" id="maia-accuracy"></span>
            </div>
            <div id="maia-stats"></div>
          </div>
        </div>

        <div class="overlay-buttons">
          <button id="game-over-review-button" onclick="reviewJustFinishedGame()">
            Review Game
          </button>
          <button id="game-over-new-game-button" onclick="newGameCurrentMode()">
            New Game
          </button>
        </div>
      </div>
    </div>

  </div>

  <div class="controls" id="game-controls">
    <button id="review-search-button" type="button">
      Search
    </button>
  </div>

  <div id="review-search-status" aria-live="polite"></div>

  <div class="controls hidden" id="puzzle-controls">
    <button id="puzzle-action-btn" onclick="handlePuzzleAction()">Give Up</button>
    <button onclick="useHint()">Hint</button>
  </div>

  <div class="controls hidden" id="drill-controls">
    <button onclick="toggleFlip()" title="Flip the board and switch which side you play">Flip / Side</button>
    <button onclick="exitDrillMode()">Close Variant</button>
    <button id="drill-restart-btn" onclick="restartCurrentDrill()">Restart</button>
    <button id="drill-undo-btn" onclick="undoDrillMove()">Undo</button>
    <button id="drill-return-line-btn" class="hidden" onclick="returnToOpeningLine()">Back to Line</button>
  </div>

  <div class="moves">
    <div class="inner" id="move-list"></div>
  </div>

<div id="history-title" hidden></div>
<div class="history" id="history"></div>

</div>

<!-- Hidden elements required by app.js -->
<div hidden>
  <input id="opening-search" type="text">
  <button id="opening-back" type="button"></button>
  <div id="variation-screen"></div>
  <div id="openings-screen"></div>
  <div id="openings-grid"></div>
</div>

<!-- Scripts -->
<script src="./chess.min.js" defer></script>
<script src="./engines/maia3/maia-tensor.js" defer></script>
<script src="./engines/maia3/maia-engine.js" defer></script>
<script src="./puzzle/reverse-fen-solver.js" defer></script>
<script src="./engines/stockfish19/stockfish-evaluator.js?v=12" defer></script>
<script src="./engines/sql/sql-wasm.js" defer></script>
<script src="./data/puzzles-db.js?v=4" defer></script>

<script src="./app.js?v=94" defer></script>
<script src="./review/review.js" defer></script>
</body>
</html>
