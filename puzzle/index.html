
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee8dc;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 608px);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        #error {
            display: none;
            padding: 20px;
            color: #8b2222;
            text-align: center;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main>
        <canvas id="board" width="608" height="582"></canvas>
        <div id="error"></div>
    </main>

    <!-- Chess and Maia -->
    <script src="/chess/chess.min.js"></script>
    <script src="/chess/engines/maia3/maia-tensor.js"></script>
    <script src="/chess/engines/maia3/maia-engine.js"></script>

    <!-- Reverse FEN Solver -->
    <script src="/chess/puzzle/reverse-fen-solver.js"></script>

    <!-- SQLite -->
    <script src="/chess/engines/sql/sql-wasm.js"></script>

    <script>
    // ========================================================
    // CONFIGURATION
    // ========================================================

    const ROOT = "/chess/";

    const DEFAULT_ELO = 1000;
    const MAIA_DATA_PATH = ROOT + "data/";

    let maiaReady = false;
    let maiaLoading = null;
    let maiaLoadError = null;

    let maiaMove = null;

    const DATABASE_WEIGHTS = {
        1: 10,
        2: 20,
        3: 40
    };

    const PIECE_FILES = {
        P: "pw.png",
        N: "nw.png",
        B: "bw.png",
        R: "rw.png",
        Q: "qw.png",
        K: "kw.png",

        p: "pb.png",
        n: "nb.png",
        b: "bb.png",
        r: "rb.png",
        q: "qb.png",
        k: "kb.png"
    };

    const STARTING_PIECES = {
        P: 8,
        N: 2,
        B: 2,
        R: 2,
        Q: 1,
        K: 1
    };

    const DEFAULT_LIGHT = [240, 217, 181];
    const DEFAULT_DARK = [181, 136, 99];

    const BACKGROUND = [185, 174, 153];

    const BOARD_SIZE = 512;
    const SQUARE_SIZE = 64;

    let HEADER_HEIGHT = 48;
    let FOOTER_HEIGHT = 22;
    let SIDEBAR_WIDTH = 96;

    let IMAGE_WIDTH = BOARD_SIZE + SIDEBAR_WIDTH;
    let IMAGE_HEIGHT = HEADER_HEIGHT + BOARD_SIZE + FOOTER_HEIGHT;

    let DISPLAY_TAKEN_PIECES = true;

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const errorElement = document.getElementById("error");

    window.CHESS_READY = false;

    const params = new URLSearchParams(
        window.location.search
    );


    // ========================================================
    // URL SETTINGS
    // ========================================================

    function readSettings() {

        let mate = null;

        if (params.has("matein")) {

            mate = Number(params.get("matein"));

            if (
                !Number.isInteger(mate) ||
                mate < 1 ||
                mate > 3
            ) {
                throw new Error(
                    "matein must be a number from 1 to 3."
                );
            }
        }

        let move = null;

        if (params.has("move")) {

            move = params.get("move").toLowerCase();

            if (move !== "white" && move !== "black") {
                throw new Error(
                    "move must be white or black."
                );
            }
        }

        function readRGB(name, fallback) {

            if (!params.has(name)) {
                return fallback;
            }

            const values = params.get(name)
                .split(",")
                .map(value => Number(value.trim()));

            if (
                values.length !== 3 ||
                values.some(value =>
                    !Number.isInteger(value) ||
                    value < 0 ||
                    value > 255
                )
            ) {
                throw new Error(
                    name + " must use RGB format: 255,255,255."
                );
            }

            return values;
        }

        function readBoolean(name, fallback = true) {

            if (!params.has(name)) {
                return fallback;
            }

            const value = params.get(name).toLowerCase();

            if (value === "true") return true;
            if (value === "false") return false;

            throw new Error(
                name + " must be true or false."
            );
        }

        let elo = DEFAULT_ELO;

        if (params.has("elo")) {

            elo = Number(params.get("elo"));

            if (
                !Number.isInteger(elo) ||
                elo < 0
            ) {
                throw new Error(
                    "elo must be a non-negative whole number."
                );
            }
        }

        return {
            mate,
            move,
            elo,

            light: readRGB("light", DEFAULT_LIGHT),
            dark: readRGB("dark", DEFAULT_DARK),

            takenPieces: readBoolean("taken_pieces"),
            title: readBoolean("title"),
            fenId: readBoolean("fen_id"),
            notation: readBoolean("notation")
        };
    }


    // ========================================================
    // CANVAS DIMENSIONS
    // ========================================================

    function configureCanvas(settings) {

        DISPLAY_TAKEN_PIECES = settings.takenPieces;

        HEADER_HEIGHT = settings.title ? 48 : 0;
        FOOTER_HEIGHT = settings.fenId ? 22 : 0;
        SIDEBAR_WIDTH = settings.takenPieces ? 96 : 0;

        IMAGE_WIDTH = BOARD_SIZE + SIDEBAR_WIDTH;

        IMAGE_HEIGHT =
            HEADER_HEIGHT +
            BOARD_SIZE +
            FOOTER_HEIGHT;

        canvas.width = IMAGE_WIDTH;
        canvas.height = IMAGE_HEIGHT;
    }


    // ========================================================
    // MAIA 3 INITIALIZATION
    // ========================================================

    async function initializeMaia() {

        if (maiaReady && window.engine) {
            return true;
        }

        if (maiaLoadError) {
            throw maiaLoadError;
        }

        if (maiaLoading) {
            return maiaLoading;
        }

        maiaLoading = (async () => {

            try {

                console.log("Maia 3: initializing...");

                if (typeof MaiaTensor === "undefined") {
                    throw new Error(
                        "MaiaTensor was not loaded."
                    );
                }

                if (typeof Chess === "undefined") {
                    throw new Error(
                        "Chess.min.js was not loaded."
                    );
                }

                if (!window.engine) {
                    throw new Error(
                        "Maia engine was not created."
                    );
                }

                if (!window.ReverseFenSolver ||
                    typeof window.ReverseFenSolver.findLikelyLastMove !== "function") {
                    throw new Error(
                        "Reverse FEN Solver is missing findLikelyLastMove()."
                    );
                }

                // Load Maia move tables.
                await MaiaTensor.initMoveTables(
                    MAIA_DATA_PATH
                );

                console.log("Maia move tables ready.");

                // Wait for the ONNX model and worker.
                await window.engine.load();

                console.log("Maia ONNX model ready.");

                maiaReady = true;

                return true;

            } catch (error) {

                maiaReady = false;
                maiaLoadError = error;

                console.error(
                    "Maia 3 initialization failed:",
                    error
                );

                throw error;
            }
        })();

        return maiaLoading;
    }

    // ========================================================
    // REVERSE FEN ANALYSIS
    // ========================================================

    async function getMaiaMove(fen, elo) {

        await initializeMaia();

        console.log(
            "Reverse FEN Solver: analyzing last move."
        );

        console.log("Target FEN:", fen);
        console.log("Maia Elo:", elo);

        const result =
            await window.ReverseFenSolver.findLikelyLastMove(
                fen,
                elo
            );

        if (!result || !result.best) {
            throw new Error(
                "Reverse FEN Solver returned no best move."
            );
        }

        const best = result.best;

        const move = {
            uci: best.uci,
            from: best.move.from,
            to: best.move.to,
            promotion: best.move.promotion || null,
            probability: best.probability,
            san: best.san,
            previousFen: best.fen,
            candidateCount: result.candidateCount,
            elo: result.elo
        };

        console.log("Reverse FEN results:", result);
        console.log("Most likely last move:", move);

        return move;
    }


    // ========================================================
    // SQLITE DATABASE
    // ========================================================

    async function loadDatabase(SQL, mate) {

        const url =
            ROOT + "puzzle/data/MateIn" + mate + ".db";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Could not load MateIn" + mate + ".db"
            );
        }

        const bytes = await response.arrayBuffer();

        return new SQL.Database(new Uint8Array(bytes));
    }


    function getPuzzleCount(db, move) {

        if (move === null) {

            const result = db.exec(
                "SELECT COUNT(*) FROM puzzles"
            );

            return Number(result[0].values[0][0]);
        }

        const color = move === "white" ? "w" : "b";

        const statement = db.prepare(`
            SELECT COUNT(*)
            FROM puzzles
            WHERE substr(fen, instr(fen, ' ') + 1, 1) = ?
        `);

        try {

            statement.bind([color]);
            statement.step();

            return Number(statement.get()[0]);

        } finally {
            statement.free();
        }
    }


    function getRandomPuzzle(db, move) {

        let statement;

        if (move === null) {

            statement = db.prepare(
                "SELECT fen FROM puzzles ORDER BY RANDOM() LIMIT 1"
            );

        } else {

            const color = move === "white" ? "w" : "b";

            statement = db.prepare(
                "SELECT fen FROM puzzles " +
                "WHERE substr(fen, instr(fen, ' ') + 1, 1) = ? " +
                "ORDER BY RANDOM() LIMIT 1"
            );

            statement.bind([color]);
        }

        try {

            if (statement.step()) {
                return statement.getAsObject().fen;
            }

            return null;

        } finally {
            statement.free();
        }
    }


    // ========================================================
    // WEIGHTED RANDOM SELECTION
    // ========================================================

    function weightedChoice(candidates) {

        const totalWeight = candidates.reduce(
            (total, candidate) =>
                total + DATABASE_WEIGHTS[candidate],
            0
        );

        let random = Math.random() * totalWeight;

        for (const mate of candidates) {

            random -= DATABASE_WEIGHTS[mate];

            if (random < 0) {
                return mate;
            }
        }

        return candidates[candidates.length - 1];
    }


    async function selectPuzzle(SQL, settings) {

        const selectedMate = settings.mate !== null
            ? settings.mate
            : weightedChoice(
                Object.keys(DATABASE_WEIGHTS).map(Number)
            );

        console.log(
            "Selected database: MateIn" + selectedMate
        );

        const db = await loadDatabase(SQL, selectedMate);

        try {

            const count = getPuzzleCount(
                db,
                settings.move
            );

            if (count === 0) {
                throw new Error(
                    "No matching puzzles in MateIn" +
                    selectedMate + "."
                );
            }

            const fen = getRandomPuzzle(
                db,
                settings.move
            );

            if (!fen) {
                throw new Error(
                    "Could not retrieve a puzzle."
                );
            }

            return {
                mate: selectedMate,
                fen
            };

        } finally {
            db.close();
        }
    }


    // ========================================================
    // FEN PARSING
    // ========================================================

    function parseFenBoard(fen) {

        const parts = fen.split(" ");

        if (parts.length < 4) {
            throw new Error("Invalid FEN.");
        }

        const position = parts[0];
        const activeColor = parts[1];

        if (activeColor !== "w" && activeColor !== "b") {
            throw new Error("Invalid FEN active color.");
        }

        const ranks = position.split("/");

        if (ranks.length !== 8) {
            throw new Error(
                "Invalid FEN: expected 8 ranks."
            );
        }

        const board = [];

        for (let row = 0; row < 8; row++) {

            const rank = [];
            let column = 0;

            for (const character of ranks[row]) {

                if (/[1-8]/.test(character)) {

                    const emptyCount = Number(character);

                    for (let i = 0; i < emptyCount; i++) {
                        rank.push(null);
                    }

                    column += emptyCount;

                } else if (PIECE_FILES[character]) {

                    rank.push(character);
                    column++;

                } else {

                    throw new Error(
                        "Invalid FEN character: " + character
                    );
                }

                if (column > 8) {
                    throw new Error(
                        "Invalid FEN rank: too many squares."
                    );
                }
            }

            if (column !== 8) {
                throw new Error(
                    "Invalid FEN rank: expected 8 squares."
                );
            }

            board.push(rank);
        }

        return {
            board,
            activeColor
        };
    }


    // ========================================================
    // BOARD ORIENTATION
    // ========================================================

    function getBoardOrientation(board, activeColor) {

        let whiteKingRow = -1;
        let blackKingRow = -1;

        for (let row = 0; row < 8; row++) {

            for (let column = 0; column < 8; column++) {

                const piece = board[row][column];

                if (piece === "K") {
                    whiteKingRow = row;
                }

                if (piece === "k") {
                    blackKingRow = row;
                }
            }
        }

        if (whiteKingRow === -1 || blackKingRow === -1) {
            throw new Error(
                "Could not find both kings in the FEN."
            );
        }

        if (whiteKingRow > blackKingRow) {
            return "white";
        }

        if (blackKingRow > whiteKingRow) {
            return "black";
        }

        return activeColor === "w" ? "white" : "black";
    }


    // ========================================================
    // CAPTURED PIECES
    // ========================================================

    function getCapturedPieces(board) {

        const counts = {
            white: {
                P: 0, N: 0, B: 0,
                R: 0, Q: 0, K: 0
            },

            black: {
                P: 0, N: 0, B: 0,
                R: 0, Q: 0, K: 0
            }
        };

        for (const rank of board) {

            for (const piece of rank) {

                if (!piece) continue;

                const side = piece === piece.toUpperCase()
                    ? "white"
                    : "black";

                const type = piece.toUpperCase();

                counts[side][type]++;
            }
        }

        const captured = {
            white: [],
            black: []
        };

        const order = ["Q", "R", "B", "N", "P", "K"];

        for (const side of ["white", "black"]) {

            for (const type of order) {

                const missing = Math.max(
                    0,
                    STARTING_PIECES[type] - counts[side][type]
                );

                const piece = side === "white"
                    ? type
                    : type.toLowerCase();

                for (let i = 0; i < missing; i++) {
                    captured[side].push(piece);
                }
            }
        }

        return captured;
    }


    // ========================================================
    // IMAGE LOADING
    // ========================================================

    const pieceImages = {};

    async function loadPieceImages(pieces) {

        const neededPieces = [
            ...new Set(pieces)
        ].filter(piece =>
            PIECE_FILES[piece] && !pieceImages[piece]
        );

        await Promise.all(
            neededPieces.map(piece => {

                return new Promise((resolve, reject) => {

                    const image = new Image();

                    image.onload = () => {
                        pieceImages[piece] = image;
                        resolve();
                    };

                    image.onerror = () => {
                        reject(new Error(
                            "Could not load piece image: " +
                            PIECE_FILES[piece]
                        ));
                    };

                    image.src =
                        ROOT + "images/pieces/" +
                        PIECE_FILES[piece];
                });
            })
        );

        console.log(
            "Loaded piece images:",
            neededPieces.map(piece => PIECE_FILES[piece])
        );
    }


    function getBoardPieces(board) {

        const pieces = [];

        for (const rank of board) {

            for (const piece of rank) {

                if (piece) {
                    pieces.push(piece);
                }
            }
        }

        return pieces;
    }


    function getCapturedPieceList(captured) {

        return [
            ...captured.white,
            ...captured.black
        ];
    }


    // ========================================================
    // DRAWING HELPERS
    // ========================================================

    function rgb(color) {

        return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
    }


    function drawHeaderText(text, x, y, font, color) {

        ctx.font = font;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = rgb(color);

        ctx.fillText(text, x, y);
    }


    // ========================================================
    // DRAW MAIN BOARD
    // ========================================================

    function drawBoard(fen, mate, light, dark, lastMove = null, notation = true) {

        const parsed = parseFenBoard(fen);

        const board = parsed.board;
        const activeColor = parsed.activeColor;

        const orientation = getBoardOrientation(
            board,
            activeColor
        );

        const captured = getCapturedPieces(board);

        // Entire background.
        ctx.fillStyle = rgb(BACKGROUND);

        ctx.fillRect(
            0,
            0,
            IMAGE_WIDTH,
            IMAGE_HEIGHT
        );

        // Header.
        if (HEADER_HEIGHT > 0) {

            const textColor = activeColor === "w"
                ? light
                : dark;

            drawHeaderText(
                "Mate In " + mate,
                BOARD_SIZE / 2,
                HEADER_HEIGHT / 2,
                "bold 20px Arial",
                textColor
            );
        }

        // Board squares.
        // The two last-move squares replace their normal colors.
        for (let row = 0; row < 8; row++) {

            for (let column = 0; column < 8; column++) {

                let displayedSquare;

                if (orientation === "black") {

                    displayedSquare =
                        String.fromCharCode(97 + (7 - column)) +
                        String(row + 1);

                } else {

                    displayedSquare =
                        String.fromCharCode(97 + column) +
                        String(8 - row);
                }

                const isLastMoveSquare =
                    lastMove &&
                    (
                        displayedSquare === lastMove.from ||
                        displayedSquare === lastMove.to
                    );

                if (isLastMoveSquare) {

                    ctx.fillStyle = "#28d34f";

                } else {

                    ctx.fillStyle =
                        (row + column) % 2 === 0
                            ? rgb(light)
                            : rgb(dark);
                }

                ctx.fillRect(
                    column * SQUARE_SIZE,
                    HEADER_HEIGHT + row * SQUARE_SIZE,
                    SQUARE_SIZE,
                    SQUARE_SIZE
                );
            }
        }

        // Board coordinates: files along the bottom, ranks along the left.
        // These are edge labels only, never full square names such as "b2".
        if (notation) {
            ctx.font = "bold 12px Arial";
            ctx.textBaseline = "alphabetic";

            for (let displayRow = 0; displayRow < 8; displayRow++) {
                for (let displayColumn = 0; displayColumn < 8; displayColumn++) {
                    const squareX = displayColumn * SQUARE_SIZE;
                    const squareY = HEADER_HEIGHT + displayRow * SQUARE_SIZE;

                    const isLightSquare = (displayRow + displayColumn) % 2 === 0;
                    ctx.fillStyle = isLightSquare ? "#6b5845" : "#f4e8d5";

                    // Rank numbers appear only on the left edge.
                    if (displayColumn === 0) {
                        const rank = orientation === "black"
                            ? displayRow + 1
                            : 8 - displayRow;

                        ctx.textAlign = "left";
                        ctx.fillText(String(rank), squareX + 4, squareY + 14);
                    }

                    // File letters appear only along the bottom edge.
                    if (displayRow === 7) {
                        const file = String.fromCharCode(
                            97 + (orientation === "black" ? 7 - displayColumn : displayColumn)
                        );

                        ctx.textAlign = "left";
                        ctx.fillText(file, squareX + 4, squareY + SQUARE_SIZE - 4);
                    }
                }
            }
        }

        // Draw pieces using the selected orientation.
        for (let displayRow = 0; displayRow < 8; displayRow++) {

            for (let displayColumn = 0; displayColumn < 8; displayColumn++) {

                let fenRow = displayRow;
                let fenColumn = displayColumn;

                if (orientation === "black") {

                    fenRow = 7 - displayRow;
                    fenColumn = 7 - displayColumn;
                }

                const piece = board[fenRow][fenColumn];

                if (!piece) continue;

                const image = pieceImages[piece];

                if (!image) {
                    throw new Error(
                        "Piece image not loaded: " + piece
                    );
                }

                const x =
                    displayColumn * SQUARE_SIZE + 2;

                const y =
                    HEADER_HEIGHT +
                    displayRow * SQUARE_SIZE + 2;

                ctx.drawImage(
                    image,
                    x,
                    y,
                    60,
                    60
                );
            }
        }

        // Footer FEN.
        if (FOOTER_HEIGHT > 0) {

            let fontSize = 12;

            ctx.textAlign = "center";
            ctx.textBaseline = "alphabetic";

            do {

                ctx.font = fontSize + "px Arial";

                if (
                    ctx.measureText(fen).width <=
                    BOARD_SIZE - 16
                ) {
                    break;
                }

                fontSize--;

            } while (fontSize >= 1);

            ctx.font = Math.max(1, fontSize) + "px Arial";
            ctx.fillStyle = "#41372d";

            ctx.fillText(
                fen,
                BOARD_SIZE / 2,
                HEADER_HEIGHT + BOARD_SIZE + 15
            );
        }

        // Sidebar background.
        if (SIDEBAR_WIDTH > 0) {

            ctx.fillStyle = rgb(BACKGROUND);

            ctx.fillRect(
                BOARD_SIZE,
                0,
                SIDEBAR_WIDTH,
                IMAGE_HEIGHT
            );
        }

        return {
            board,
            orientation,
            captured
        };
    }


    // ========================================================
    // DRAW CAPTURED PIECES SIDEBAR
    // ========================================================

    function drawCapturedSidebar(captured) {

        if (!DISPLAY_TAKEN_PIECES) return;

        function groupPieces(pieces) {

            const groups = {};

            for (const piece of pieces) {
                groups[piece] = (groups[piece] || 0) + 1;
            }

            return Object.entries(groups);
        }

        const whiteGroups = groupPieces(captured.white);
        const blackGroups = groupPieces(captured.black);

        const centerX = BOARD_SIZE + 35;

        const dividerY = HEADER_HEIGHT + BOARD_SIZE / 2;

        // Divider.
        ctx.strokeStyle = "rgba(65, 55, 45, 0.45)";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.moveTo(BOARD_SIZE + 18, dividerY);
        ctx.lineTo(IMAGE_WIDTH - 18, dividerY);
        ctx.stroke();

        function drawGroups(
            groups,
            numberColor,
            top,
            bottom,
            fromBottom
        ) {

            if (groups.length === 0) return;

            const padding = 8;
            const gap = 5;

            const availableHeight =
                bottom - top - padding * 2;

            const pieceSize = Math.min(
                42,
                (availableHeight - (groups.length - 1) * gap) /
                groups.length
            );

            const stackHeight =
                groups.length * pieceSize +
                (groups.length - 1) * gap;

            let y = fromBottom
                ? bottom - padding - stackHeight
                : top + padding;

            for (const [piece, count] of groups) {

                const image = pieceImages[piece];

                if (!image) {
                    throw new Error(
                        "Captured piece image missing: " + piece
                    );
                }

                ctx.drawImage(
                    image,
                    centerX - pieceSize / 2,
                    y,
                    pieceSize,
                    pieceSize
                );

                if (count > 1) {

                    ctx.font = "bold 17px Arial";
                    ctx.textAlign = "right";
                    ctx.textBaseline = "bottom";
                    ctx.fillStyle = numberColor;

                    ctx.fillText(
                        count.toString(),
                        centerX + pieceSize / 2 - 2,
                        y + pieceSize - 1
                    );
                }

                y += pieceSize + gap;
            }
        }

        // Top: black captured pieces.
        drawGroups(
            blackGroups,
            "#FFFFFF",
            HEADER_HEIGHT,
            dividerY,
            false
        );

        // Bottom: white captured pieces.
        drawGroups(
            whiteGroups,
            "#000000",
            dividerY,
            HEADER_HEIGHT + BOARD_SIZE,
            true
        );

        console.log("Captured pieces:", captured);
    }


    // ========================================================
    // MAIN
    // ========================================================

    async function main() {

        window.CHESS_READY = false;

        try {

            errorElement.style.display = "none";
            canvas.style.display = "block";

            const settings = readSettings();

            configureCanvas(settings);

            console.log("Display settings:", {
                takenPieces: settings.takenPieces,
                title: settings.title,
                fenId: settings.fenId,
                notation: settings.notation,
                elo: settings.elo
            });

            // Check required libraries.
            if (typeof initSqlJs !== "function") {
                throw new Error(
                    "SQLite engine failed to load."
                );
            }

            if (typeof Chess === "undefined") {
                throw new Error(
                    "Chess.min.js failed to load."
                );
            }

            // Initialize SQLite.
            const SQL = await initSqlJs({
                locateFile: file =>
                    ROOT + "engines/sql/" + file
            });

            // Select one puzzle.
            const puzzle = await selectPuzzle(
                SQL,
                settings
            );

            console.log(
                "Loaded MateIn" + puzzle.mate,
                puzzle.fen
            );

            // Parse original database FEN.
            const parsed = parseFenBoard(puzzle.fen);

            const captured = getCapturedPieces(
                parsed.board
            );

            // Analyze the likely previous move.
            console.log("Starting Maia reverse-FEN analysis...");

            maiaMove = await getMaiaMove(
                puzzle.fen,
                settings.elo
            );

            console.log(
                "Maia analysis complete:",
                maiaMove
            );

            // Load board pieces.
            const boardPieces = getBoardPieces(
                parsed.board
            );

            await loadPieceImages(boardPieces);

            // Draw the ORIGINAL database position.
            const drawing = drawBoard(
                puzzle.fen,
                puzzle.mate,
                settings.light,
                settings.dark,
                maiaMove,
                settings.notation
            );

            // Load and draw captured pieces.
            if (settings.takenPieces) {

                const capturedPieces = getCapturedPieceList(
                    captured
                );

                await loadPieceImages(capturedPieces);

                drawCapturedSidebar(captured);
            }

            // Finished.
            console.log(
                "Board orientation:",
                drawing.orientation
            );

            console.log("Canvas dimensions:", {
                width: canvas.width,
                height: canvas.height
            });

            console.log("Predicted last move:", maiaMove);

            console.log(
                "Predicted move probability:",
                (maiaMove.probability * 100).toFixed(4) + "%"
            );

            window.CHESS_READY = true;

        } catch (error) {

            console.error(error);

            window.CHESS_READY = false;

            canvas.style.display = "none";

            errorElement.textContent =
                error.message || String(error);

            errorElement.style.display = "block";
        }
    }

    main();

    </script>
</body>
</html>
