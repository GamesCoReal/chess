
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Puzzle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee8dc;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 608px);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        #error {
            display: none;
            padding: 20px;
            color: #8b2222;
            text-align: center;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main>
        <canvas id="board" width="608" height="582"></canvas>
        <div id="error"></div>
    </main>

    <script src="/chess/engines/sql/sql-wasm.js"></script>

    <script>
    // ========================================================
    // CONFIGURATION
    // ========================================================

    const ROOT = "/chess/";

    const DATABASE_WEIGHTS = {
        1: 10,
        2: 20,
        3: 40
    };

    const PIECE_FILES = {
        "P": "pw.png",
        "N": "nw.png",
        "B": "bw.png",
        "R": "rw.png",
        "Q": "qw.png",
        "K": "kw.png",

        "p": "pb.png",
        "n": "nb.png",
        "b": "bb.png",
        "r": "rb.png",
        "q": "qb.png",
        "k": "kb.png"
    };

    // Standard starting material for each side.
    const STARTING_PIECES = {
        "P": 8,
        "N": 2,
        "B": 2,
        "R": 2,
        "Q": 1,
        "K": 1
    };

    const DEFAULT_LIGHT = [240, 217, 181];
    const DEFAULT_DARK = [181, 136, 99];

    // Shared color for header, footer and sidebar.
    const BACKGROUND = [185, 174, 153];

    const BOARD_SIZE = 512;
    const HEADER_HEIGHT = 48;
    const FOOTER_HEIGHT = 22;
    const SQUARE_SIZE = 64;

    const SIDEBAR_WIDTH = 96;

    const IMAGE_WIDTH = BOARD_SIZE + SIDEBAR_WIDTH;
    const IMAGE_HEIGHT = HEADER_HEIGHT + BOARD_SIZE + FOOTER_HEIGHT;

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const errorElement = document.getElementById("error");

    const params = new URLSearchParams(
        window.location.search
    );


    // ========================================================
    // URL SETTINGS
    // ========================================================

    function readSettings() {

        let mate = null;

        if (params.has("matein")) {

            mate = Number(params.get("matein"));

            if (
                !Number.isInteger(mate) ||
                mate < 1 ||
                mate > 3
            ) {
                throw new Error(
                    "matein must be a number from 1 to 3."
                );
            }
        }

        let move = null;

        if (params.has("move")) {

            move = params.get("move").toLowerCase();

            if (move !== "white" && move !== "black") {
                throw new Error(
                    "move must be white or black."
                );
            }
        }

        function readRGB(name, fallback) {

            if (!params.has(name)) {
                return fallback;
            }

            const values = params.get(name)
                .split(",")
                .map(value => Number(value.trim()));

            if (
                values.length !== 3 ||
                values.some(value =>
                    !Number.isInteger(value) ||
                    value < 0 ||
                    value > 255
                )
            ) {
                throw new Error(
                    name + " must use RGB format: 255,255,255."
                );
            }

            return values;
        }

        return {
            mate,
            move,
            light: readRGB("light", DEFAULT_LIGHT),
            dark: readRGB("dark", DEFAULT_DARK)
        };
    }


    // ========================================================
    // SQLITE DATABASE
    // ========================================================

    async function loadDatabase(SQL, mate) {

        const url = ROOT + "puzzle/data/MateIn" +
            mate + ".db";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(
                "Could not load MateIn" + mate + ".db"
            );
        }

        const bytes = await response.arrayBuffer();

        return new SQL.Database(new Uint8Array(bytes));
    }


    function getPuzzleCount(db, move) {

        if (move === null) {

            const result = db.exec(
                "SELECT COUNT(*) FROM puzzles"
            );

            return Number(result[0].values[0][0]);
        }

        const color = move === "white" ? "w" : "b";

        const statement = db.prepare(`
            SELECT COUNT(*)
            FROM puzzles
            WHERE substr(fen, instr(fen, ' ') + 1, 1) = ?
        `);

        try {
            statement.bind([color]);
            statement.step();

            return Number(statement.get()[0]);

        } finally {
            statement.free();
        }
    }


    function getRandomPuzzle(db, move) {

        let statement;

        if (move === null) {

            statement = db.prepare(
                "SELECT fen FROM puzzles ORDER BY RANDOM() LIMIT 1"
            );

        } else {

            const color = move === "white" ? "w" : "b";

            statement = db.prepare(
                "SELECT fen FROM puzzles " +
                "WHERE substr(fen, instr(fen, ' ') + 1, 1) = ? " +
                "ORDER BY RANDOM() LIMIT 1"
            );

            statement.bind([color]);
        }

        try {

            if (statement.step()) {
                return statement.getAsObject().fen;
            }

            return null;

        } finally {
            statement.free();
        }
    }


    // ========================================================
    // WEIGHTED RANDOM SELECTION
    // ========================================================

    function weightedChoice(candidates) {

        const totalWeight = candidates.reduce(
            (total, candidate) =>
                total + DATABASE_WEIGHTS[candidate],
            0
        );

        let random = Math.random() * totalWeight;

        for (const mate of candidates) {

            random -= DATABASE_WEIGHTS[mate];

            if (random < 0) {
                return mate;
            }
        }

        return candidates[candidates.length - 1];
    }


    async function selectPuzzle(SQL, settings) {

        // Select database before downloading.
        const selectedMate = settings.mate !== null
            ? settings.mate
            : weightedChoice(
                Object.keys(DATABASE_WEIGHTS).map(Number)
            );

        console.log(
            "Selected database: MateIn" + selectedMate
        );

        // Download only one database.
        const db = await loadDatabase(SQL, selectedMate);

        try {

            const count = getPuzzleCount(
                db,
                settings.move
            );

            if (count === 0) {
                throw new Error(
                    "No matching puzzles in MateIn" +
                    selectedMate + "."
                );
            }

            const fen = getRandomPuzzle(
                db,
                settings.move
            );

            if (!fen) {
                throw new Error(
                    "Could not retrieve a puzzle."
                );
            }

            return {
                mate: selectedMate,
                fen
            };

        } finally {
            db.close();
        }
    }


    // ========================================================
    // FEN PARSING
    // ========================================================

    function parseFenBoard(fen) {

        const parts = fen.split(" ");

        if (parts.length < 4) {
            throw new Error("Invalid FEN.");
        }

        const position = parts[0];
        const activeColor = parts[1];

        if (activeColor !== "w" && activeColor !== "b") {
            throw new Error("Invalid FEN active color.");
        }

        const ranks = position.split("/");

        if (ranks.length !== 8) {
            throw new Error(
                "Invalid FEN: expected 8 ranks."
            );
        }

        const board = [];

        for (let row = 0; row < 8; row++) {

            const rank = [];
            let column = 0;

            for (const character of ranks[row]) {

                if (/[1-8]/.test(character)) {

                    const emptyCount = Number(character);

                    for (let i = 0; i < emptyCount; i++) {
                        rank.push(null);
                    }

                    column += emptyCount;

                } else if (PIECE_FILES[character]) {

                    rank.push(character);
                    column++;

                } else {

                    throw new Error(
                        "Invalid FEN character: " + character
                    );
                }

                if (column > 8) {
                    throw new Error(
                        "Invalid FEN rank: too many squares."
                    );
                }
            }

            if (column !== 8) {
                throw new Error(
                    "Invalid FEN rank: expected 8 squares."
                );
            }

            board.push(rank);
        }

        return {
            board,
            activeColor
        };
    }


    // ========================================================
    // BOARD ORIENTATION
    // ========================================================

    function getBoardOrientation(board, activeColor) {

        let whiteKingRow = -1;
        let blackKingRow = -1;

        for (let row = 0; row < 8; row++) {

            for (let column = 0; column < 8; column++) {

                const piece = board[row][column];

                if (piece === "K") {
                    whiteKingRow = row;
                }

                if (piece === "k") {
                    blackKingRow = row;
                }
            }
        }

        if (whiteKingRow === -1 || blackKingRow === -1) {
            throw new Error(
                "Could not find both kings in the FEN."
            );
        }

        // FEN rows increase from top to bottom.
        // The king on the lower rank determines
        // which player is displayed at the bottom.

        if (whiteKingRow > blackKingRow) {
            return "white";
        }

        if (blackKingRow > whiteKingRow) {
            return "black";
        }

        // Fallback if both kings share a rank.
        return activeColor === "w" ? "white" : "black";
    }


    // ========================================================
    // CAPTURED PIECES
    // ========================================================

    function getCapturedPieces(board) {

        const counts = {
            white: {
                P: 0,
                N: 0,
                B: 0,
                R: 0,
                Q: 0,
                K: 0
            },

            black: {
                P: 0,
                N: 0,
                B: 0,
                R: 0,
                Q: 0,
                K: 0
            }
        };

        // Count all pieces currently on the board.
        for (const rank of board) {

            for (const piece of rank) {

                if (!piece) continue;

                const side = piece === piece.toUpperCase()
                    ? "white"
                    : "black";

                const type = piece.toUpperCase();

                counts[side][type]++;
            }
        }

        const captured = {
            white: [],
            black: []
        };

        const order = ["Q", "R", "B", "N", "P", "K"];

        for (const side of ["white", "black"]) {

            for (const type of order) {

                const missing = Math.max(
                    0,
                    STARTING_PIECES[type] - counts[side][type]
                );

                const piece = side === "white"
                    ? type
                    : type.toLowerCase();

                for (let i = 0; i < missing; i++) {
                    captured[side].push(piece);
                }
            }
        }

        return captured;
    }


    // ========================================================
    // IMAGE LOADING
    // ========================================================

    const pieceImages = {};

    async function loadPieceImages(pieces) {

        const neededPieces = [
            ...new Set(pieces)
        ].filter(piece =>
            PIECE_FILES[piece] && !pieceImages[piece]
        );

        await Promise.all(
            neededPieces.map(piece => {

                return new Promise((resolve, reject) => {

                    const image = new Image();

                    image.onload = () => {
                        pieceImages[piece] = image;
                        resolve();
                    };

                    image.onerror = () => {
                        reject(new Error(
                            "Could not load piece image: " +
                            PIECE_FILES[piece]
                        ));
                    };

                    image.src =
                        ROOT + "images/pieces/" +
                        PIECE_FILES[piece];
                });
            })
        );

        console.log(
            "Loaded piece images:",
            neededPieces.map(piece => PIECE_FILES[piece])
        );
    }


    function getBoardPieces(board) {

        const pieces = [];

        for (const rank of board) {

            for (const piece of rank) {

                if (piece) {
                    pieces.push(piece);
                }
            }
        }

        return pieces;
    }


    function getCapturedPieceList(captured) {

        return [
            ...captured.white,
            ...captured.black
        ];
    }


    // ========================================================
    // DRAWING HELPERS
    // ========================================================

    function rgb(color) {

        return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
    }


    function drawHeaderText(text, x, y, font, color) {

        ctx.font = font;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = rgb(color);

        ctx.fillText(text, x, y);
    }


    // ========================================================
    // DRAW MAIN BOARD
    // ========================================================

    function drawBoard(fen, mate, light, dark) {

        const parsed = parseFenBoard(fen);

        const board = parsed.board;
        const activeColor = parsed.activeColor;

        const orientation = getBoardOrientation(
            board,
            activeColor
        );

        const captured = getCapturedPieces(board);

        // Entire background.
        ctx.fillStyle = rgb(BACKGROUND);

        ctx.fillRect(
            0,
            0,
            IMAGE_WIDTH,
            IMAGE_HEIGHT
        );

        // Header.
        const textColor = activeColor === "w"
            ? light
            : dark;

        drawHeaderText(
            "Mate In " + mate,
            BOARD_SIZE / 2,
            HEADER_HEIGHT / 2,
            "bold 20px Arial",
            textColor
        );

        // Board squares.
        for (let row = 0; row < 8; row++) {

            for (let column = 0; column < 8; column++) {

                ctx.fillStyle =
                    (row + column) % 2 === 0
                        ? rgb(light)
                        : rgb(dark);

                ctx.fillRect(
                    column * SQUARE_SIZE,
                    HEADER_HEIGHT + row * SQUARE_SIZE,
                    SQUARE_SIZE,
                    SQUARE_SIZE
                );
            }
        }

        // Draw pieces using the selected orientation.
        for (let displayRow = 0; displayRow < 8; displayRow++) {

            for (let displayColumn = 0; displayColumn < 8; displayColumn++) {

                let fenRow = displayRow;
                let fenColumn = displayColumn;

                if (orientation === "black") {

                    fenRow = 7 - displayRow;
                    fenColumn = 7 - displayColumn;
                }

                const piece = board[fenRow][fenColumn];

                if (!piece) continue;

                const image = pieceImages[piece];

                if (!image) {
                    throw new Error(
                        "Piece image not loaded: " + piece
                    );
                }

                const x =
                    displayColumn * SQUARE_SIZE + 2;

                const y =
                    HEADER_HEIGHT +
                    displayRow * SQUARE_SIZE + 2;

                ctx.drawImage(
                    image,
                    x,
                    y,
                    60,
                    60
                );
            }
        }

        // Footer FEN.
        let fontSize = 12;

        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";

        do {

            ctx.font = fontSize + "px Arial";

            if (
                ctx.measureText(fen).width <=
                BOARD_SIZE - 16
            ) {
                break;
            }

            fontSize--;

        } while (fontSize >= 1);

        ctx.font = Math.max(1, fontSize) + "px Arial";
        ctx.fillStyle = "#41372d";

        ctx.fillText(
            fen,
            BOARD_SIZE / 2,
            HEADER_HEIGHT + BOARD_SIZE + 15
        );

        // Sidebar background.
        ctx.fillStyle = rgb(BACKGROUND);

        ctx.fillRect(
            BOARD_SIZE,
            0,
            SIDEBAR_WIDTH,
            IMAGE_HEIGHT
        );

        return {
            board,
            orientation,
            captured
        };
    }


    // ========================================================
    // DRAW CAPTURED PIECES SIDEBAR
    // ========================================================

    function drawCapturedSidebar(captured) {

        const whitePieces = captured.white;
        const blackPieces = captured.black;

        const totalPieces =
            whitePieces.length + blackPieces.length;

        if (totalPieces === 0) {
            console.log("No captured pieces to display.");
            return;
        }

        const startY = HEADER_HEIGHT + 8;
        const availableHeight = BOARD_SIZE - 16;

        const hasBothColors =
            whitePieces.length > 0 &&
            blackPieces.length > 0;

        const gap = 2;
        const dividerSpace = hasBothColors ? 10 : 0;

        const pieceSize = Math.min(
            42,
            (
                availableHeight -
                (totalPieces - 1) * gap -
                dividerSpace
            ) / totalPieces
        );

        const centerX =
            BOARD_SIZE + SIDEBAR_WIDTH / 2;

        let y = startY;

        function drawStack(pieces) {

            for (const piece of pieces) {

                const image = pieceImages[piece];

                if (!image) {
                    throw new Error(
                        "Captured piece image missing: " + piece
                    );
                }

                ctx.drawImage(
                    image,
                    centerX - pieceSize / 2,
                    y,
                    pieceSize,
                    pieceSize
                );

                y += pieceSize + gap;
            }
        }

        // White captured pieces first.
        drawStack(whitePieces);

        // Separate the two colors.
        if (hasBothColors) {

            y += 3;

            ctx.strokeStyle = "rgba(65, 55, 45, 0.45)";
            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(
                BOARD_SIZE + 18,
                y
            );

            ctx.lineTo(
                IMAGE_WIDTH - 18,
                y
            );

            ctx.stroke();

            y += 7;
        }

        // Black captured pieces afterward.
        drawStack(blackPieces);

        console.log("Captured pieces:", captured);
    }


    // ========================================================
    // MAIN
    // ========================================================

    async function main() {

        try {

            errorElement.style.display = "none";
            canvas.style.display = "block";

            const settings = readSettings();

            if (typeof initSqlJs !== "function") {
                throw new Error(
                    "SQLite engine failed to load."
                );
            }

            // Initialize SQLite.
            const SQL = await initSqlJs({
                locateFile: file =>
                    ROOT + "engines/sql/" + file
            });

            // Select and retrieve one puzzle.
            const puzzle = await selectPuzzle(
                SQL,
                settings
            );

            // Parse FEN before loading images.
            const parsed = parseFenBoard(puzzle.fen);

            const captured = getCapturedPieces(
                parsed.board
            );

            // PHASE 1:
            // Download only pieces currently on the board.
            const boardPieces = getBoardPieces(
                parsed.board
            );

            await loadPieceImages(boardPieces);

            // Draw header, board and footer.
            const drawing = drawBoard(
                puzzle.fen,
                puzzle.mate,
                settings.light,
                settings.dark
            );

            // PHASE 2:
            // Only after the board is drawn, load captured pieces.
            const capturedPieces = getCapturedPieceList(
                captured
            );

            await loadPieceImages(capturedPieces);

            // Draw captured pieces in the sidebar.
            drawCapturedSidebar(captured);

            console.log(
                "Loaded MateIn" + puzzle.mate,
                puzzle.fen
            );

            console.log(
                "Board orientation:",
                drawing.orientation
            );

        } catch (error) {

            console.error(error);

            canvas.style.display = "none";

            errorElement.textContent = error.message;
            errorElement.style.display = "block";
        }
    }

    main();

    </script>
</body>
</html>
