<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chess vs Maia</title>
<link rel="icon" type="image/png" href="./images/icons/favicon.png">
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("./service-worker.js").catch((error) => {
    console.error("Offline file cache could not start:", error);
  });
}
</script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}
html,body{
margin:0;height:100%;background:#202124;color:#fff;
overscroll-behavior-y:none;
-webkit-text-size-adjust:100%;
}
body{
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.container{
width:100%;
max-width:520px;
margin:0 auto;
padding:12px 14px calc(24px + env(safe-area-inset-bottom));
}

.menu{display:grid;grid-template-columns:1fr;margin-bottom:4px;align-items:start;position:relative;z-index:5}
.menu-shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:10px}
.menu-shortcuts button{min-height:42px;padding:7px 4px;border:0;border-radius:8px;background:#2f3136;color:#fff;font-size:13px;line-height:1.15;cursor:pointer;white-space:normal}
.menu-shortcuts button:active{background:#3a3b3e}
.menu-item{position:relative}
.menu-item>button{
position:relative;z-index:3;
width:100%;
background:none;border:none;color:#fff;padding:12px 4px;
font-size:clamp(13px,3.6vw,16px);cursor:pointer;-webkit-user-select:none;user-select:none;
border-radius:8px;
}
.menu-item>button:active{background:#2f3136}
.menu-item.open>button{background:#2f3136}
.menu-item:hover>button{background:#2f3136}
#settings-item>button{background:#2f3136}
#settings-item>button:active,
#settings-item:hover>button,
#settings-item.open>button{background:#3a3b3e}



.dropdown{
position:absolute;
top:100%;left:0;right:0;
display:flex;justify-content:center;
pointer-events:none;
z-index:1;
}
.menu-item.open .dropdown,
.menu-item:hover .dropdown{pointer-events:auto}

.dropdown-inner{padding-top:2px;display:flex;flex-direction:column;align-items:center;position:relative}

.circle{
position:absolute;top:0;left:50%;
width:34px;height:34px;border-radius:50%;background:#3a3b3e;
opacity:0;
transform:translate(-50%,-44px) scale(.3);
}
.menu-item.open .circle,
.menu-item:hover .circle{
animation:circleDrop .3s ease forwards;
}
@keyframes circleDrop{
0%{opacity:0;transform:translate(-50%,-44px) scale(.3)}
15%{opacity:1}
70%{opacity:1;transform:translate(-50%,0) scale(1)}
100%{opacity:0;transform:translate(-50%,0) scale(.7)}
}

.hint-highlight {
background: rgba(255, 215, 0, 0.55) !important;
}

.split{
display:flex;gap:0;margin-top:0;
}
.menu-item.open .split,
.menu-item:hover .split{
animation:splitGap .3s ease .28s forwards;
}
@keyframes splitGap{
0%{gap:0}
100%{gap:8px}
}

.split button{
background:#3a3b3e;border:none;color:#fff;cursor:pointer;
-webkit-user-select:none;user-select:none;
white-space:nowrap;overflow:hidden;
width:34px;height:34px;
border-radius:50%;
padding:0;
opacity:0;
font-size:clamp(11px,3vw,13px);
box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.menu-item.open .split button,
.menu-item:hover .split button{
animation:circleGrow .32s cubic-bezier(.34,1.3,.64,1) .28s forwards;
}
@keyframes circleGrow{
0%{width:34px;height:34px;border-radius:50%;opacity:0;padding:0}
25%{opacity:1}
100%{width:88px;height:34px;border-radius:14px;opacity:1;padding:8px 10px}
}

/* Settings: instead of splitting sideways, the ball drops then each button
   pops open one after another going straight down */
.vstack{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:0}
.vstack button{
background:#3a3b3e;border:none;color:#fff;cursor:pointer;
-webkit-user-select:none;user-select:none;
white-space:nowrap;overflow:hidden;
width:34px;height:34px;
border-radius:50%;
padding:0;
opacity:0;
font-size:clamp(10.5px,2.8vw,12px);
box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.menu-item.open .vstack button,
.menu-item:hover .vstack button{
animation:vstackGrow .3s cubic-bezier(.34,1.3,.64,1) forwards;
}
@keyframes vstackGrow{
0%{width:34px;height:34px;border-radius:50%;opacity:0;padding:0}
25%{opacity:1}
100%{width:150px;height:34px;border-radius:14px;opacity:1;padding:8px 10px}
}
.vstack button:nth-child(1){animation-delay:.28s}
.vstack button:nth-child(2){animation-delay:.5s}
.vstack button:nth-child(3){animation-delay:.72s}
.vstack button:nth-child(4){animation-delay:.94s}
.vstack button:nth-child(5){animation-delay:1.16s}
.vstack button:nth-child(6){animation-delay:1.38s}
.vstack button:nth-child(7){animation-delay:1.6s}

.player{box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(8ch,1fr);align-items:center;width:min(100%,700px);margin:8px auto;font-size:clamp(15px,4.2vw,19px)}
.container.review-mode .player{width:calc(100% - 54px);margin:8px 16px 8px 38px}
.player-name{grid-column:1;display:flex;align-items:center;min-width:0;white-space:nowrap}
.player-opening-name{justify-self:center;max-width:100%;overflow:hidden;color:#c9a84c;font-size:.7em;text-align:center;text-overflow:ellipsis;white-space:nowrap}
#your-clock,#maia-clock{grid-column:3}
.capture-slot{display:flex;align-items:center;min-width:0;flex-shrink:1;gap:1px}
.capture-slot:empty{display:none}
.capture-slot img{width:18px;height:18px;flex:0 0 18px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
#your-clock,#maia-clock{min-width:8ch;text-align:right;font-variant-numeric:tabular-nums}
#board-wrap{
    display:flex;
    flex-direction:column;
    position:relative;
}

/* Normal */
#maia-player{
    order:1;
}

#board-with-eval{
    order:2;
}

#your-player{
    order:3;
}

/* Flipped */
/* Status line above the board — sits OUTSIDE board-wrap on purpose, so
   flipping the board never moves it. Used while Maia is loading, fades
   away when ready / it's not your turn. */
#mode-badge{
text-align:center;
font-size:11px;
font-weight:700;
letter-spacing:.5px;
text-transform:uppercase;
color:#c9a84c;
margin-top:2px;
}
#offline-status{min-height:14px;text-align:center;font-size:10px;line-height:14px;color:#bfc0c3}
#status{
text-align:center;
margin:2px 0 10px;
font-size:14px;
color:#bbb;
min-height:18px;
transition:opacity .6s ease;
opacity:1;
}
#status.status-hidden{opacity:0}
#status.maia-downloading::after{
content:"";display:block;width:100%;height:3px;margin:7px auto 0;
background:linear-gradient(90deg,#c9a84c 0 35%,#4a4b4e 35% 100%);
background-size:300% 100%;border-radius:2px;
animation:download-progress 1.15s linear infinite;
}
#status.maia-downloading.has-progress::after{
background:linear-gradient(90deg,#c9a84c 0 var(--download-progress),#4a4b4e var(--download-progress) 100%);
background-size:100% 100%;animation:none;
}
@keyframes download-progress{from{background-position:100% 0}to{background-position:-200% 0}}

/* Real board, driven by app.js */
#board{
position:relative;
display:grid;
grid-template-columns:repeat(8,1fr);
grid-template-rows:repeat(8,1fr);
width:min(100%, 700px);
aspect-ratio:1/1;
margin:auto;
border:3px solid #555;
border-radius:4px;
overflow:hidden;
touch-action:none;
}
#board-with-eval{display:grid;grid-template-columns:32px minmax(0,1fr) 10px;gap:6px;align-items:stretch;width:100%}
#capture-rail{display:grid;grid-template-rows:1fr 1fr;min-height:0}
.capture-rail-side{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:2px;min-height:0;padding:3px 0}
.capture-rail-side.bottom{justify-content:flex-end}
.captured-piece-count{position:relative;width:27px;height:27px;flex:0 0 27px}
.captured-piece-count img{display:block;width:100%;height:100%;object-fit:contain}
.captured-piece-count .count-badge{position:absolute;right:0;bottom:0;z-index:1;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-width:13px;height:13px;padding:0 2px;border-radius:7px;font-size:9px;line-height:1;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.captured-piece-count.piece-white span{background:#eee;color:#111}
.captured-piece-count.piece-black span{background:#222;color:#fff}
.replay-eval-meter{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0}
.replay-eval-score{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%);min-width:48px;width:max-content;padding:1px 3px;border-radius:3px;background:rgba(25,26,28,.82);box-shadow:0 1px 4px rgba(0,0,0,.55);font-size:10px;line-height:14px;color:#fff;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.replay-eval-bar{display:flex;flex:1;flex-direction:column;align-self:stretch;min-height:0;overflow:hidden;border:1px solid #555;border-radius:4px;background:#25262a}
.replay-eval-bar.hidden{display:none}
.replay-eval-meter{position:relative}
.eval-bar-black{flex:0 0 50%;width:100%;background:#25262a}
.eval-bar-white{flex:0 0 50%;width:100%;background:#eee}
.review-insights-panel{box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:2px;width:min(100%,700px);height:42px;overflow:hidden;margin:6px auto 10px;padding:4px 10px;border:1px solid #45464a;border-radius:6px;background:#232427;font-size:12px;line-height:15px;text-align:center}
.review-insights-panel.puzzle-insights{flex-direction:row;align-items:center;justify-content:center;gap:10px}
.review-insights-copy{display:flex;flex:1;flex-direction:column;justify-content:center;min-width:0}
.review-insights-panel.puzzle-insights>.review-insights-copy{height:auto;min-height:30px}
.puzzle-side-indicator{flex:0 0 18px;width:18px;height:18px;border:1px solid #999;border-radius:2px}
.puzzle-side-indicator.white{background:#f0f0f0}
.puzzle-side-indicator.black{background:#171717}
.study-progress{width:min(100%,700px);margin:5px auto 8px}
.study-progress[hidden]{display:none}
.study-progress-label{margin-bottom:3px;color:#bfc0c3;font-size:11px;text-align:center}
.study-progress-track{height:5px;overflow:hidden;border-radius:4px;background:#414246}
.study-progress-fill{height:100%;width:0;border-radius:4px;background:#c9a84c;transition:width .2s ease}
.hc-puzzle-details{display:grid;gap:2px;padding:1px 2px}
.hc-puzzle-details .hc-stat{overflow-wrap:anywhere}
#history-title{margin:12px 0 4px;color:#aaa;font-size:12px;text-align:center}
#history-title[hidden]{display:none}
.review-insights-panel>div{height:15px;min-height:15px;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap}
.review-insight-pro{color:#9bd5a3}
.review-insight-con{color:#efa2a2}
.review-insight-out-of-line{color:#fff;font-weight:700;text-align:center}
.board-annotations marker.line-arrow-1 path{fill:#2478ff}
.board-annotations marker.line-arrow-stockfish path{fill:#32c66a}
.board-annotations marker.line-arrow-1 path,.board-annotations marker.line-arrow-stockfish path{stroke:none}
.board-annotations path.engine-arrow{stroke-width:6;opacity:.92}
.board-annotations path.engine-arrow-1{stroke:#2478ff}
.board-annotations path.engine-arrow-stockfish{stroke:#32c66a}
.square{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.square.drag-hover{outline:3px solid #c9a84c;outline-offset:-3px;background-color:rgba(201,168,76,.25)}
.drag-ghost{
position:fixed;top:0;left:0;
pointer-events:none;
z-index:500;
opacity:.95;
filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
}
.square.light{background:#f0d9b5}
.square.dark{background:#b58863}
.square.selected{outline:3px solid #c9a84c;outline-offset:-3px}
.square.premove-square{background:#df4545!important;outline:2px solid #ff7777;outline-offset:-2px}
.square.last-move{background-color:rgba(201,168,76,.45)}
.board-annotations{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible}
.board-annotations path,.board-annotations circle{stroke:#e53935;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.board-annotations path{fill:none}
.board-annotations marker path{fill:#e53935;stroke:none}
.board-annotations circle{fill:rgba(229,57,53,.22)}
.board-annotations .annotation-preview{opacity:.65}
.square.legal-target::after{
content:"";
position:absolute;
width:32%;height:32%;
border-radius:50%;
background:rgba(255,255,255,.85);
pointer-events:none;
}
.square.legal-target.has-piece::after{
width:88%;height:88%;
background:transparent;
border:5px solid rgba(255,255,255,.75);
box-sizing:border-box;
}
.square-coordinate{position:absolute;pointer-events:none;user-select:none;font-size:11px;line-height:1;font-weight:700;opacity:.75;z-index:1}
.square-coordinate.file-label{right:4px;bottom:3px}
.square-coordinate.rank-label{left:4px;top:50%;transform:translateY(-50%)}
.square.dark .square-coordinate{color:rgba(255,255,255,.72)}
.square.light .square-coordinate{color:rgba(0,0,0,.56)}
.piece{width:80%;height:80%;pointer-events:none;user-select:none;position:relative;z-index:2}

.moves{
width:100%;margin:14px auto;border-top:1px solid #444;border-bottom:1px solid #444;
overflow-x:auto;overflow-y:hidden;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
-ms-overflow-style:none;
}
.moves::-webkit-scrollbar{display:none;}

.inner{width:max-content;padding:8px 0;white-space:nowrap;font-size:clamp(14px,4vw,18px)}
.movenum{color:#888;margin-right:2px}
.move{margin-right:14px}
.move.replay-current-move{display:inline-block;margin-right:9px;padding:2px 6px;border-radius:999px;background:#fff;color:#111;font-weight:700}
.piece-rating-badge{position:absolute;top:2px;right:2px;width:clamp(13px,40%,22px);height:auto;z-index:6;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
.controls{display:flex;justify-content:center;gap:10px;margin:18px auto;flex-wrap:wrap}
.controls button{
flex:1 1 0;
min-height:44px;
background:#3a3b3e;border:none;color:#fff;font-size:clamp(14px,3.8vw,16px);
padding:12px 10px;border-radius:22px;cursor:pointer;-webkit-user-select:none;user-select:none;
}
.controls button:active{background:#4c4d51}
.container.review-mode #game-controls{justify-content:flex-end;margin:4px auto 10px}
.container.review-mode #game-controls #resign-button,
.container.review-mode #game-controls #draw-button{display:none}
.container.review-mode #game-controls #flip-button{flex:0 0 auto;min-width:76px}
.replay-controls{width:min(100%,700px);gap:6px;margin:10px auto;flex-wrap:nowrap}
.replay-controls button{flex:0 0 auto;min-width:42px;min-height:40px;padding:8px 12px;font-size:14px}
.replay-controls #replay-exit,
.replay-controls #flip-button{flex:1 1 0;min-width:0;min-height:40px;padding:8px 6px}
.replay-controls #replay-position{display:flex;flex-direction:column;justify-content:center;min-width:30px;color:#bfc0c3;font-size:12px;line-height:13px;font-variant-numeric:tabular-nums;text-align:center}
.replay-position-current{font-weight:700}
.replay-position-total{font-size:10px;font-weight:700;color:#888}
.hidden{display:none}

/* Game history: a 4-column grid of button-cards, same width as the controls
   row above it, growing downward as far as needed — the page scrolls, not a box */
.history{
width:100%;margin:10px auto 0;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
}
.history-empty{
grid-column:1/-1;
padding:16px 6px;color:#888;font-size:13px;text-align:center;
}
.history-card{
background:#2d2d2d;border:1px solid #4a4a4a;border-radius:10px;
padding:6px 4px 5px;
color:#fff;
font-family:inherit;
cursor:pointer;
display:flex;flex-direction:column;
gap:3px;
text-align:center;
-webkit-user-select:none;user-select:none;
}
.history-card:active{background:#353638}

.hc-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.hc-result{font-size:clamp(10px,2.6vw,12px);font-weight:700}
.hc-mode{font-size:clamp(6.5px,1.7vw,8px);color:#999;text-transform:uppercase;letter-spacing:.3px}

.hc-top{display:flex;position:relative}
.hc-player{flex:1;min-width:0}
.hc-player h4{font-size:clamp(8.5px,2.2vw,10px);font-weight:700;margin-bottom:2px;color:#ddd}
.hc-stat{font-size:clamp(7px,1.9vw,9px);line-height:1.35;color:#ccc}
.hc-divider{
position:absolute;left:50%;top:2px;bottom:2px;width:1px;
transform:translateX(-50%);
background:linear-gradient(to bottom, rgba(255,255,255,.05), rgba(255,255,255,.35) 15%, rgba(255,255,255,.35) 85%, rgba(255,255,255,.05));
}

.hc-moves{
font-family:Consolas,"Courier New",monospace;
font-size:clamp(6.5px,1.8vw,8.5px);
color:#aaa;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
border-top:1px solid #444;padding-top:4px;margin-top:1px;
}

@media (max-width:360px){
.history{grid-template-columns:repeat(2,1fr)}
}

/* Game-over popup — centers on the board, not the whole screen */
.overlay{
position:absolute;inset:0;
background:rgba(0,0,0,.7);
display:flex;align-items:center;justify-content:center;
z-index:200;padding:16px;
border-radius:4px;
}
.overlay.hidden{display:none}
.overlay-card{
background:#2b2c30;border:1px solid #444;border-radius:16px;
padding:20px 18px;width:100%;max-width:340px;text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.5);
max-height:80vh;overflow-y:auto;
}
.overlay-title{font-size:20px;font-weight:700;margin-bottom:2px}
.overlay-sub{font-size:13px;color:#999;margin-bottom:16px}
.overlay-stats-columns{display:flex;gap:14px;text-align:left;margin-bottom:18px}
.stats-col{flex:1;min-width:0}
.stats-col-title{font-weight:700;font-size:13px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.stats-col-title .acc{color:#c9a84c;font-weight:700}
.stat-line{display:flex;justify-content:space-between;padding:2px 0;color:#ccc;font-size:12px;gap:6px}
.stat-line .num{font-weight:600;color:#fff}
.overlay-buttons button{
width:100%;min-height:44px;border:none;border-radius:22px;
background:#c9a84c;color:#202124;font-weight:700;font-size:15px;cursor:pointer;
-webkit-user-select:none;user-select:none;
}
.overlay-buttons button:active{opacity:.8}

.openings-browser{position:relative;width:100%;margin:0 auto;overflow:visible;background:transparent;color:inherit;padding-bottom:env(safe-area-inset-bottom)}
.container.openings-mode>#review-insights-panel,
.container.openings-mode>#status,
.container.openings-mode>#board-wrap,
.container.openings-mode>.moves,
.container.openings-mode>#game-controls,
.container.openings-mode>#puzzle-controls,
.container.openings-mode>#drill-controls,
.container.openings-mode>#history,
.container.openings-mode>#history-title{display:none!important}
.openings-topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:center;min-height:64px;padding:10px 18px;border-bottom:1px solid #3a3b3e;background:#202124}
.openings-search-wrap{position:relative;width:min(100%,360px);height:40px}
.openings-browser.drill-active .openings-search-wrap{display:none}
.openings-topbar>.review-insights-panel{flex:1;width:100%;max-width:700px;height:42px;margin:0}
.openings-browser.drill-active .openings-topbar{flex-direction:column;gap:6px;align-items:stretch;padding:8px 12px}
.openings-browser.drill-active .openings-topbar>.review-insights-panel{flex:0 0 auto}
.openings-topbar>.study-progress{width:min(100%,700px);margin:0 auto}
.openings-search{width:100%;height:100%;padding:0 14px;border:1px solid #303947;border-radius:10px;outline:none;background:#0d1218;color:#e8edf3;font-size:13px}
.openings-search::placeholder{color:#6f7b89}
.openings-search:focus{border-color:#536174}
.openings-screen,.variation-screen{width:100%;padding:22px 14px 40px}
.opening-grid,.variation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start;width:100%;margin:0 auto}
.opening-card{overflow:hidden;border:1px solid #242d38;border-radius:8px;background:#151b23;cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.opening-card:hover{transform:translateY(-2px);border-color:#3b4756;background:#181f28}
.opening-board-wrap{position:relative;width:100%;padding:4px;background:#10151b}
.opening-progress-flag{position:absolute;top:8px;left:8px;z-index:1;display:grid;place-items:center;width:22px;height:22px;border:1px solid currentColor;border-radius:6px;background:rgba(13,17,23,.9);font-size:16px;line-height:1}
.opening-progress-flag.is-mastered{color:#63d483}
.opening-progress-flag.is-mistake{color:#f0c64f}
.opening-progress-flag.is-incomplete{color:#ef6868}
.opening-board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;aspect-ratio:1;border:1px solid #000;border-radius:4px;overflow:hidden}
.opening-square{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.opening-square.light{background:#c9b18c}
.opening-square.dark{background:#6b503e}
.opening-piece{width:88%;height:88%;object-fit:contain;user-select:none;pointer-events:none}
.opening-info{padding:8px}
.opening-title{margin:0;overflow:hidden;font-size:12px;font-weight:750;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.opening-result-name{overflow:hidden;margin-bottom:4px;color:#8d98a6;font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.opening-family-progress{margin-top:4px;color:#9bd5a3;font-size:10px;font-weight:700}
.opening-result-bar{display:flex;width:100%;height:8px;margin-top:6px;overflow:hidden;border-radius:999px;background:#30343b}
.opening-result-bar>span{height:100%;min-width:0}
.opening-result-win{background:#63d483}
.opening-result-draw{background:#aeb8c5}
.opening-result-loss{background:#ef6868}
.openings-empty{grid-column:1/-1;padding:28px 12px;color:#8d98a6;text-align:center}
.variation-screen{display:none}
.variation-screen.active{display:block}
.opening-back{display:block;width:min(700px,100%);margin:0 auto 14px;padding:9px 12px;border:1px solid #303947;border-radius:8px;background:transparent;color:#aeb8c5;text-align:left;font-size:12px;cursor:pointer}
.opening-back:hover{background:#151b23;color:#e8edf3}
.opening-variation-choice{width:100%;padding:0;border:0;background:transparent;color:inherit;text-align:inherit;cursor:pointer}
.opening-drill-screen{width:100%;min-height:100%;padding:10px 12px 28px}
.opening-game-stage{width:min(520px,100%);margin:0 auto}
.openings-browser.drill-active #openings-screen,
.openings-browser.drill-active #variation-screen{display:none!important}
.openings-browser.drill-active #opening-drill-screen{display:block!important}
@media(max-width:520px){.opening-grid,.variation-grid{gap:6px}.openings-screen,.variation-screen{padding-left:9px;padding-right:9px}.opening-info{padding:6px}}
.storage-overlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.76)}
.storage-overlay.hidden{display:none}
.storage-panel{width:min(540px,100%);max-height:min(780px,92vh);overflow:auto;background:#232427;border:1px solid #555;border-radius:8px;padding:16px;color:#eee;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.motif-glossary-panel{width:min(900px,100%)}
.motif-glossary-content{box-sizing:border-box;width:100%;height:min(72vh,680px);overflow:auto;padding:12px 16px;border:1px solid #45464a;border-radius:3px;background:#1d1e20;color:#e1e2e4;font-size:14px;line-height:1.55}
.motif-glossary-content h1{margin:0 0 12px;font-size:24px}
.motif-glossary-content h2{margin:20px 0 8px;padding-top:8px;border-top:1px solid #45464a;font-size:19px}
.motif-glossary-content h3{margin:14px 0 4px;color:#a9d5ff;font-size:15px}
.motif-glossary-content p{margin:4px 0 10px}
.motif-glossary-content ul{margin:4px 0 10px;padding-left:22px}
.motif-glossary-content hr{border:0;border-top:1px solid #45464a;margin:14px 0}
.motif-glossary-content code{padding:1px 4px;border-radius:3px;background:#33353a;color:#f0d494;font-size:12px}
.motif-glossary-link{display:inline-block;margin-top:8px;color:#9bcaff;font-size:12px}
.storage-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #45464a;padding-bottom:10px;margin-bottom:10px}
.storage-header h2{margin:0;font-size:18px}
.storage-close{width:34px;height:34px;border:0;border-radius:4px;background:#3a3b3e;color:#fff;font-size:22px;cursor:pointer}
.storage-summary,.storage-note{font-size:12px;line-height:1.45;color:#bfc0c3;margin:6px 0}
.opening-achievements-panel{width:min(760px,100%)}
.opening-achievements-search{box-sizing:border-box;width:100%;margin:4px 0 8px;padding:10px;border:1px solid #555;border-radius:6px;background:#1d1e20;color:#fff;font-size:14px}
.opening-achievements-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:min(62vh,620px);overflow:auto;padding:2px}
.opening-achievement-card{display:flex;align-items:center;gap:9px;min-width:0;min-height:80px;padding:8px;border:1px solid #45464a;border-radius:7px;background:#1d1e20}
.opening-achievement-icon{display:flex;flex:0 0 64px;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:#393a3e;color:#c9a84c;font-size:36px;font-weight:700}
canvas.opening-achievement-icon{display:block}
.opening-achievement-description{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:12px}
.opening-achievement-description strong{overflow:hidden;color:#eee;text-overflow:ellipsis}
.opening-achievement-description span{color:#9b9da2;font-size:10px}
.opening-achievements-empty{grid-column:1/-1;padding:14px;text-align:center;color:#aaa;font-size:13px}
.opening-achievement-toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:1200;width:max-content;max-width:calc(100vw - 28px);padding:11px 16px;transform:translateX(-50%);border:1px solid #c9a84c;border-radius:20px;background:#2b2c2f;color:#f5df9c;text-align:center;font-size:13px;font-weight:700;box-shadow:0 5px 18px rgba(0,0,0,.45)}
.storage-group-title{margin:14px 0 4px;font-size:13px;font-weight:700;color:#e8e8e8}
.storage-list{border-top:1px solid #45464a}
.storage-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid #393a3d;padding:7px 1px}
.storage-row-main{min-width:0}
.storage-row-name{font-size:13px;font-weight:600}
.storage-row-state{font-size:11px;color:#aeb0b4;margin-top:3px}
.storage-action{min-width:78px;min-height:32px;border:1px solid #626368;border-radius:4px;background:#36373b;color:#fff;padding:5px 9px;font-size:12px;cursor:pointer}
.storage-action.primary{background:#c9a84c;border-color:#c9a84c;color:#202124;font-weight:700}
.storage-action.danger{border-color:#a74b4b;color:#ffb7b7}
.storage-action:disabled{opacity:.55;cursor:wait}

/* Hide scrollbar but keep scrolling */
#motif-glossary-content {
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

#motif-glossary-content::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* Also hide it if the overlay itself is the scrolling element */
#motif-glossary-overlay {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

#motif-glossary-overlay::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}
</style>
</head>
<body>
<div class="container">
<div id="offline-status" aria-live="polite"></div>
<div class="menu">
<div class="menu-item" id="settings-item">
<button onclick="toggleMenu('settings-item')">Settings</button>
<div class="dropdown"><div class="dropdown-inner">
<div class="circle"></div>
<div class="vstack">
<button id="settings-username-btn" onclick="setUsername()">Username: You</button>
<button id="settings-sound-btn" onclick="toggleSound()">Sound: On</button>
<button id="settings-defaultmode-btn" onclick="cycleDefaultMode()">Default: Ranked</button>
<button id="settings-opening-achievements-btn" onclick="openOpeningAchievements()">Achievements</button>
<button id="settings-glossary-btn" onclick="openMotifGlossary()">Motif Glossary</button>
<button id="settings-storage-btn" onclick="openStorageManager()">Storage</button>
<button onclick="clearAllSavedData()">Clear Saved Data</button>
</div>
</div></div>
</div>

</div>

<div class="menu-shortcuts">
<button type="button" onclick="selectMode('rated')">Chess</button>
<button type="button" onclick="enterPuzzleMode()">Puzzle</button>
<button type="button" onclick="openDrillPicker()">Openings</button>
</div>

<section id="drill-picker-overlay" class="openings-browser hidden" aria-label="Openings">
<header class="openings-topbar">
<div class="openings-search-wrap">
<input id="opening-search" class="openings-search" type="search" placeholder="Search openings, variations, or moves..." autocomplete="off">
</div>
</header>
<main id="openings-screen" class="openings-screen">
<div id="openings-grid" class="opening-grid"></div>
</main>
<section id="variation-screen" class="variation-screen">
<button id="opening-back" class="opening-back" type="button">← Back to openings</button>
<div id="variation-grid" class="variation-grid"></div>
</section>
<section id="opening-drill-screen" class="opening-drill-screen" style="display:none">
<div id="opening-game-stage" class="opening-game-stage"></div>
</section>
</section>

<div id="review-insights-panel" class="review-insights-panel hidden" aria-live="polite"></div>
<div id="study-progress" class="study-progress" hidden>
<div id="study-progress-label" class="study-progress-label"></div>
<div class="study-progress-track"><div id="study-progress-fill" class="study-progress-fill"></div></div>
</div>

<div id="status">Loading...</div>

<div id="storage-manager-overlay" class="storage-overlay hidden" onclick="closeStorageManager(event)">
<section class="storage-panel" role="dialog" aria-modal="true" aria-labelledby="storage-manager-title" onclick="event.stopPropagation()">
<header class="storage-header"><h2 id="storage-manager-title">Storage</h2><button type="button" class="storage-close" aria-label="Close storage manager" onclick="closeStorageManager()">&times;</button></header>
<div id="storage-usage" class="storage-summary">Checking site storage...</div>
<div id="storage-manager-status" class="storage-note" aria-live="polite"></div>
<h3 class="storage-group-title">Puzzle databases</h3>
<div id="puzzle-storage-list" class="storage-list"></div>
</section>
</div>

<div id="motif-glossary-overlay" class="storage-overlay hidden" onclick="closeMotifGlossary(event)">
<section class="storage-panel motif-glossary-panel" role="dialog" aria-modal="true" aria-labelledby="motif-glossary-title" onclick="event.stopPropagation()">
<header class="storage-header"><h2 id="motif-glossary-title">Motif Glossary</h2><button type="button" class="storage-close" aria-label="Close motif glossary" onclick="closeMotifGlossary()">&times;</button></header>
<article id="motif-glossary-content" class="motif-glossary-content" aria-live="polite">Loading motifs.md...</article>
<a class="motif-glossary-link" href="./motifs.md" target="_blank" rel="noopener">Open motifs.md directly</a>
</section>
</div>

<div id="opening-achievements-overlay" class="storage-overlay hidden" onclick="closeOpeningAchievements(event)">
<section class="storage-panel opening-achievements-panel" role="dialog" aria-modal="true" aria-labelledby="opening-achievements-title" onclick="event.stopPropagation()">
<header class="storage-header"><h2 id="opening-achievements-title">Achievements</h2><button type="button" class="storage-close" aria-label="Close opening achievements" onclick="closeOpeningAchievements()">&times;</button></header>
<div id="opening-achievements-progress" class="storage-summary"></div>
<input id="opening-achievements-search" class="opening-achievements-search" type="search" placeholder="Search openings" aria-label="Search opening achievements" oninput="searchOpeningAchievements(this.value)">
<div id="opening-achievements-list" class="opening-achievements-list"></div>
</section>
</div>

<div id="opening-achievement-toast" class="opening-achievement-toast hidden" aria-live="polite"></div>

<div id="board-wrap">
<div class="player" id="maia-player"><span class="player-name">Maia (<span id="maia-rating">250</span>)</span><span id="maia-opening-name" class="player-opening-name" hidden></span><span id="maia-clock">10:00</span></div>

<div id="board-with-eval">
<div id="capture-rail" aria-label="Captured pieces"><div id="capture-top" class="capture-rail-side"></div><div id="capture-bottom" class="capture-rail-side bottom"></div></div>
<div id="board"></div>
<div id="replay-eval-meter" class="replay-eval-meter hidden">
<span id="replay-eval-score" class="replay-eval-score">+0.0</span>
<div id="replay-eval-bar" class="replay-eval-bar" role="button" tabindex="0" aria-label="Position evaluation">
<span class="eval-bar-black"></span><span class="eval-bar-white"></span>
</div>
</div>
</div>

<div class="player" id="your-player"><span class="player-name"><span id="your-name-label">You</span> (<span id="your-rating">250</span>)</span><span id="your-opening-name" class="player-opening-name" hidden></span><span id="your-clock">10:00</span></div>
<div class="overlay hidden" id="game-over-overlay">
<div class="overlay-card">
<div class="overlay-title" id="overlay-title">Game Over</div>
<div class="overlay-sub" id="overlay-sub"></div>
<div class="overlay-stats-columns">
<div class="stats-col">
<div class="stats-col-title"><span>You</span><span class="acc" id="your-accuracy"></span></div>
<div id="your-stats"></div>
</div>
<div class="stats-col">
<div class="stats-col-title"><span>Maia</span><span class="acc" id="maia-accuracy"></span></div>
<div id="maia-stats"></div>
</div>
</div>
<div class="overlay-buttons">
<button onclick="newGameCurrentMode()">New Game</button>
</div>
</div>
</div>
</div>

<div class="controls" id="game-controls">
<button id="resign-button" onclick="resign()">Resign</button>
<button id="draw-button">Draw</button>
<button id="flip-button" onclick="toggleFlip()">Flip</button>
</div>

<div class="controls hidden" id="puzzle-controls">
<button id="puzzle-action-btn" onclick="handlePuzzleAction()">Give Up</button>
<button onclick="useHint()">Hint</button>
</div>

<div class="controls hidden" id="drill-controls">
<button onclick="toggleFlip()" title="Flip the board and switch which side you play">Flip / Side</button>
<button onclick="exitDrillMode()">Close Variant</button>
<button id="drill-restart-btn" onclick="restartCurrentDrill()">Restart</button>
<button id="drill-undo-btn" onclick="undoDrillMove()">Undo</button>
<button id="drill-return-line-btn" class="hidden" onclick="returnToOpeningLine()">Back to Line</button>
</div>

<div class="moves">
<div class="inner" id="move-list"></div>
</div>

<div id="history-title" hidden></div>
<div class="history" id="history">
</div>
</div>

<script>
function toggleMenu(id){
var el=document.getElementById(id);
var wasOpen=el.classList.contains('open');
document.querySelectorAll('.menu-item.open').forEach(function(item){item.classList.remove('open');});
if(!wasOpen){el.classList.add('open');}
}
document.addEventListener('click',function(e){
if(!e.target.closest('.menu-item')){
document.querySelectorAll('.menu-item.open').forEach(function(item){item.classList.remove('open');});
}
});
</script>

<script src="./engines/sql/sql-wasm.js" defer></script>
<script src="./data/puzzles-db.js?v=4" defer></script>
<script src="./app.js?v=85" defer></script>
